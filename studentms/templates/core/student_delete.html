{% extends 'core/base.html' %}

{% block title %}Delete Student — Student MS{% endblock %}

{% block content %}

<div class="danger-card">
    <div class="danger-icon">🗑️</div>
    <h2 class="danger-title">Delete Student?</h2>
    <p class="danger-text">
        You are about to permanently delete
        <strong>{{ student.full_name }}</strong>.
        This action cannot be undone.
    </p>
    <form method="POST" style="display:flex; gap:10px; justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-lg">
            Yes, Delete
        </button>
        <a href="{% url 'student_detail' student.slug %}" class="btn btn-secondary btn-lg">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
