{% extends 'core/base.html' %}

{% block title %}Add Student — Student MS{% endblock %}

{% block content %}

<a href="{% url 'student_list' %}" class="back-link">← Back to Students</a>

<div class="form-card">
    <h2 class="form-title">🎓 Add New Student</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="form-error">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg" style="flex:1;">
                Save Student
            </button>
            <a href="{% url 'student_list' %}" class="btn btn-secondary btn-lg">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
