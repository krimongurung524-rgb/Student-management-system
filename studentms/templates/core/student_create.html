{% extends 'core/base.html' %}

{% block title %}Add Student — Student MS{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Add New Student</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom:4px;">
                <label style="font-size:13px; color:#64748b; font-weight:600;">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p style="color:#ef4444; font-size:12px; margin-top:-10px; margin-bottom:8px;">
                        {{ field.errors.0 }}
                    </p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Save Student</button>
    </form>
</div>
{% endblock %}
