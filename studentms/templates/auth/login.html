<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Student MS</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .wrapper {
        width: 100%;
        max-width: 420px;
    }
    .logo {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: #6366f1;
        margin-bottom: 24px;
    }
    .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .card h2 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .card p { font-size: 14px; color: #94a3b8; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        color: #1e293b;
        background: #fafafa;
        outline: none;
        transition: all 0.2s;
        margin-bottom: 16px;
    }
    input:focus { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    button {
        width: 100%;
        background: #6366f1;
        color: #fff;
        border: none;
        padding: 13px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s;
        margin-top: 8px;
    }
    button:hover { background: #4f46e5; }
    .footer-link { text-align: center; font-size: 14px; color: #64748b; margin-top: 20px; }
    .footer-link a { color: #6366f1; text-decoration: none; font-weight: 600; }
    .message { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
    .message-error { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .message-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .error-text { color: #ef4444; font-size: 12px; margin-top: -10px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
<div class="wrapper">
    <div class="logo">🎓 StudentMS</div>
    <div class="card">
        <h2>Welcome back</h2>
        <p>Login to your account to continue</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label>{{ field.label }}</label>
                    <input
                        type="{{ field.field.widget.input_type }}"
                        name="{{ field.html_name }}"
                        placeholder="Enter {{ field.label|lower }}"
                        {% if field.value %}value="{{ field.value }}"{% endif %}
                    >
                    {% if field.errors %}
                        <span class="error-text">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit">🔐 Login</button>
        </form>

        <p class="footer-link">
            Don't have an account?
            <a href="{% url 'register_view' %}">Register here</a>
        </p>
    </div>
</div>
</body>
</html>
